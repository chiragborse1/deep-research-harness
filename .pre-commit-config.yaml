# Pre-commit hooks. Kept fast on purpose: the heavy gates live in CI, not in the local hook.
#
# Install once with:
#   uvx pre-commit install
#
# The ruff rev is pinned so the local hook and CI lint agree byte-for-byte.

ci:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: endpoint-independence
        name: no vendor SDK in core
        entry: uv run python scripts/check_endpoint_independence.py
        language: system
        files: ^src/.*[.]py$
        pass_filenames: false
      - id: docstrings
        name: public API docstrings
        entry: uv run python scripts/check_docs.py
        language: system
        files: ^src/.*[.]py$
        pass_filenames: false
