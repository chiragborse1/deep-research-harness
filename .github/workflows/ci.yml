name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_VERSION: "0.11"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --all-extras
      - name: Build wheel and sdist
        run: uv build
      - name: Verify the built wheel imports and exposes a typed public API
        run: uv run python scripts/verify_build.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --all-extras
      - name: Assert no provider credential is present in the environment
        run: uv run python scripts/assert_offline.py
      - name: Run test suite with coverage
        run: uv run pytest -m "not slow and not network"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check --diff .
      - name: Public API docstring gate
        run: uv run python scripts/check_docs.py

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --all-extras
      - name: mypy --strict
        run: uv run mypy
      - name: Reject vendor SDKs in core library code
        run: uv run python scripts/check_endpoint_independence.py

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --all-extras
      - name: Export the resolved lockfile for auditing
        run: uv export --format requirements-txt --no-emit-project --no-hashes -o requirements-audit.txt
      - name: pip-audit (known vulnerabilities in dependencies)
        # Audits the exported lockfile rather than the installed environment: the project
        # itself is an editable local install and is by definition not on PyPI.
        run: uv run pip-audit --strict -r requirements-audit.txt
      - name: bandit (insecure code patterns)
        run: uv run bandit -r src --severity-level medium
      - name: Initialize CodeQL for Python
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'

  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --all-extras
      - name: Verify the README quickstart commands are real and runnable
        run: uv run python scripts/verify_quickstart.py

  ci-passed:
    name: ci-passed
    if: always()
    runs-on: ubuntu-latest
    needs: [build, test, lint, typecheck, security-scan]
    steps:
      - name: Fail if any required job failed
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed: $r"
              exit 1
            fi
          done
          echo "All required jobs passed."
