[project]
name = "drh"
version = "0.1.0"
description = "A long-horizon research agent harness: crash-consistent durable state, sandboxed tool execution, and a veracity ledger for every claim."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Chirag Borse", email = "chiragborse877@gmail.com" }]
keywords = [
  "agents",
  "llm",
  "research",
  "durable-execution",
  "veracity",
  "open-source",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "pytest-benchmark>=5.1",
  "ruff>=0.7",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/chiragborse1/deep-research-harness"
Repository = "https://github.com/chiragborse1/deep-research-harness"
Issues = "https://github.com/chiragborse1/deep-research-harness/issues"
Changelog = "https://github.com/chiragborse1/deep-research-harness/blob/main/CHANGELOG.md"

[project.scripts]
drh = "drh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drh"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "C4",  # comprehensions
  "UP",  # pyupgrade
  "SIM", # simplify
  "RET", # returns
  "ARG", # unused arguments
  "PTH", # use pathlib
  "TID", # tidy imports
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # function call in default arg (pydantic Field is fine)
  "RUF001", # ambiguous unicode — used intentionally in docs
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = false
show_error_codes = true
mypy_path = "src"
packages = ["drh"]

[[tool.mypy.overrides]]
module = ["tests.*", "bench.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=drh",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=80",
]
markers = [
  'slow: marks tests as slow (deselect with -m "not slow")',
  'chaos: crash-injection tests that spawn subprocesses',
  "network: tests that require outbound network (skipped in CI)",
]
asyncio_mode = "strict"
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*"]

[tool.coverage.run]
branch = true
source = ["src/drh"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]
show_missing = true

[tool.bench]
# placeholder so `[tool.bench]` is a known table; see bench/README.md
